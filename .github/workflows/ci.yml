name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Registry builds, verifies, and is committed
        run: |
          pnpm registry:build
          pnpm registry:verify
          git diff --exit-code apps/www/registry.json apps/www/registry apps/www/public/r apps/www/public/llms.txt apps/www/public/llms-full.txt skills
      - run: pnpm --filter www build
      - name: E2E (OAuth flow, axe a11y in both themes, theme and pending contracts)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        env:
          CI: true
